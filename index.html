function getSpokenTopicPhrase(title) {
  const t = String(title || '').toLowerCase();
  if (t.includes('ec vs resale') || t.includes('executive condo')) return 'comparing a new Executive Condo against a resale private condo';
  if (t.includes('district 15') || t.includes('d15') || t.includes('floorplan')) return 'choosing the right District 15 freehold three-bedder floorplan';
  if (t.includes('absd') || t.includes('decoupling')) return 'understanding the 2026 IRAS ABSD remission timeline';
  if (t.includes('tdsr') || t.includes('variable income')) return 'structuring your 55 percent MAS TDSR borrowing power';
  if (t.includes('interest rate') || t.includes('sora')) return 'timing SORA interest rate cycles against URA entry prices';
  return 'unlocking your five-year HDB MOP upgrade window';
}

function getTopicSpokenScriptLines(title, p) {
  const theme = detectTopicTheme(title);
  const naturalPhrase = getSpokenTopicPhrase(title);

  if (theme === 'EC_VS_CONDO') {
    return [
      `Before you upgrade from your HDB in 2026, should you buy a new Executive Condo or a resale private condo?`,
      `New Executive Condos give you a twenty percent entry price cushion and deferred mortgage payments until key collection.`,

      `Comment COMPARE below or tap my WhatsApp link, and I will send you the full 2026 cashflow calculator.`

  }
  if (theme === 'FLOORPLAN_D15') {
    return [
      `Looking at East Coast freehold condos in 2026? Not all one-thousand-square-foot three-bedders live the same.`,
      `According to URA REALIS data, choosing a dumbbell layout eliminates dead hallway space and saves nearly two hundred thousand dollars.`,

      `Comment D15 below or tap my WhatsApp link, and I will send you the three side-by-side floorplan comparisons.`

  if (theme === 'ABSD_TAX') {
    return [
      `Do you really need to decouple to upgrade your family home in 2026? Let's look at official IRAS rules first.`,
      `Married Singapore Citizen couples buying a completed resale condo qualify for a full twenty percent ABSD refund within six months.`,
      `If you are buying an uncompleted new launch, that six-month HDB sale clock only starts when the condo reaches TOP.`,
      `Comment ABSD below or tap my WhatsApp link, and I will send you the 2026 Upgrader Timeline Checklist.`
    ];
  }
  return [
    `Stop treating your property timeline like a waiting game—here is why ${naturalPhrase} is your strongest lever in 2026.`,
    `According to 2026 URA REALIS and HDB resale data, buyers who structure their equity window early capture the widest pool of full-CPF demand.`,
    `By aligning your CPF Ordinary Account refund and fifty-five percent MAS TDSR buffer six months ahead, you protect your family's cash reserve.`,
    `Comment PLAN below or tap my WhatsApp link, and I will send you the full 2026 progression sheet.`
  ];
}

function buildDeterministicGoogleFlowClips(title, clipSec, p, scriptText = '') {
  const s = Number(clipSec) || 8;
  const defaultLines = getTopicSpokenScriptLines(title, p);
  const quoteMatches = String(scriptText || '').match(/"([^"]{12,200})"/g) || [];

  // Clean any raw title colons out of extracted quotes so Veo speaks naturally
  const cleanSpoken = (rawLine, fallback) => {
    if (!rawLine) return fallback;
    const stripped = rawLine.replace(/"/g, '').trim();
    if (stripped.includes(':') && stripped.length > 70) return fallback;
    return stripped;
  };

  const line1 = cleanSpoken(quoteMatches[0], defaultLines[0]);
  const line2 = cleanSpoken(quoteMatches[1], defaultLines[1]);
  const line3 = cleanSpoken(quoteMatches[2], defaultLines[2]);
  const line4 = cleanSpoken(quoteMatches[3], defaultLines[3]);

  // STANDARDIZED MASTER VOICEPRINT LOCK (Identical across all 4 clips so voice never changes!)

  return `=== CLIP 1 (0–${s}s: Presenter Hook — Attach Uploaded ${p.name} Profile Photo as Starting Frame) ===

Subject Action & Lip-Sync Delivery: ${p.name} looks directly into the camera lens with warm, authoritative executive presence, making a natural, measured hand gesture while speaking clearly in English: "${line1}"
Background Motion & Lighting: Soft golden-hour natural key light illuminates the presenter's face with crisp catchlights, while distant clouds drift imperceptibly across the Singapore skyline outside the window over a continuous ${s}-second take.
Audio: ${voiceLock}, synced naturally to the presenter's lips, saying: "${line1}" Supported by quiet luxury indoor room tone; no background music, no echo, no sudden sound effects.

=== CLIP 2 (${s}–${s * 2}s: Property Interior & Data Proof — Attach Living Room / Floorplan Photo as Starting Frame) ===
Camera: Slow, ultra-steady gimbal dolly push-in moving smoothly forward along the central axis of the open-concept living and dining room on a 24mm rectilinear architectural cinema lens, maintaining strict perspective and zero barrel distortion.
Scene & Positive Geometry Lock: High-resolution luxury Singapore condominium interior anchored to the starting frame. All architectural geometry, walls, recessed ceiling coves, built-in cabinetry, marble countertops, flooring planks, and furniture silhouettes remain 100% stationary, rigid, and structurally unchanged throughout the shot.
Layered Micro-Motion Physics: Sheer white floor-to-ceiling balcony curtains billow gently inward with soft, realistic fabric inertia in a light breeze, while warm afternoon sunlight shifts subtly across the polished floor. Outside the large glass windows, soft clouds drift slowly across the skyline.
Lighting & Pacing: Consistent soft natural daylight with stable interior reflections on polished surfaces; restrained, ultra-low motion pacing suited for luxury architectural cinematography over a continuous ${s}-second take.
Audio: ${voiceLock} saying: "${line2}" Accompanied by quiet luxury indoor room tone; no background music, no random voices.

=== CLIP 3 (${s * 2}–${s * 3}s: Balcony Skyline & Cashflow Takeaway — Attach Balcony/Kitchen Photo as Starting Frame) ===
Camera: Smooth, stabilized lateral camera slider movement from left to right across the private balcony overlooking the greenery and Singapore residential skyline on a 35mm cinema lens with locked horizon geometry.
Scene & Positive Geometry Lock: High-resolution balcony and exterior facade anchored directly to the starting frame. Every glass balustrade, tile seam, structural column, and surrounding building silhouette remains 100% rigid, stationary, and locked to the starting frame without warping.

}
